# 辞書の law_id を e-Gov 法令 API と突き合わせ、e-Gov 全件の law_id が isValidLawId で
# true になることを月次で確かめる（scripts/verify-law-ids.mjs）。PR では走らせない。
name: verify-law-ids

on:
  schedule:
    - cron: '17 3 1 * *' # 毎月 1 日 03:17 UTC
  workflow_dispatch:

jobs:
  verify-law-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run verify-law-ids
